team: my-team
description: TeamAI shared resources
repo: https://github.com/Ldelicate/TeamAi-giencoder.git
provider: github
sharing:
  rules:
    enforced: []
  docs:
    localDir: ~/.teamai/docs
  env:
    injectShellProfile: true
reviewers:
  - Ldelicate
toolPaths:
  claude:
    skills: .claude/skills
    rules: .claude/rules
    settings: .claude/settings.json
    claudemd: .claude/CLAUDE.md
    agents: .claude/agents
    mcp: .claude.json
    mcpProject: .mcp.json
  codex:
    skills: .codex/skills
    rules: .codex/rules
    settings: .codex/hooks.json
    agents: .codex/agents
    mcp: .codex/config.toml
  codex-internal:
    skills: .codex-internal/skills
    rules: .codex-internal/rules
    settings: .codex-internal/hooks.json
    agents: .codex-internal/agents
  claude-internal:
    skills: .claude-internal/skills
    rules: .claude-internal/rules
    settings: .claude-internal/settings.json
    claudemd: .claude-internal/CLAUDE.md
    agents: .claude-internal/agents
  tclaude:
    skills: .tclaude/skills
    rules: .tclaude/rules
    settings: .tclaude/settings.json
    claudemd: .tclaude/CLAUDE.md
    agents: .tclaude/agents
    mcp: .tclaude/.claude.json
  tcodex:
    skills: .tcodex/skills
    rules: .tcodex/rules
    settings: .tcodex/hooks.json
    agents: .tcodex/agents
  cursor:
    skills: .cursor/skills
    rules: .cursor/rules
    settings: .cursor/hooks.json
    agents: .cursor/agents
    mcp: .cursor/mcp.json
    mcpProject: .cursor/mcp.json
  codebuddy:
    skills: .codebuddy/skills
    rules: .codebuddy/rules
    settings: .codebuddy/settings.json
    claudemd: .codebuddy/CODEBUDDY.md
    agents: .codebuddy/agents
    mcp: .codebuddy/mcp.json
    mcpProject: .codebuddy/mcp.json
  openclaw:
    skills: .openclaw/skills
    rules: .openclaw/rules
    claudemd: .openclaw/workspace/AGENTS.md
  hermes:
    skills: .hermes/skills
    claudemd: AGENTS.md
  workbuddy:
    skills: .workbuddy/skills
    rules: .workbuddy/rules
    settings: .workbuddy/settings.json
    claudemd: AGENTS.md
    mcp: .workbuddy/mcp.json
    mcpProject: .workbuddy/mcp.json
  gienx:
    skills: .gienx/skills
